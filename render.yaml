services:
  - type: web
    name: parcelpilot-ai-support
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: REFERENCE_TIMESTAMP
        value: 2026-08-16T11:00:00+05:30
      - key: GEMINI_API_KEY
        sync: false
